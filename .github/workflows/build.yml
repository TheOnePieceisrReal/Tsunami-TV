name: Build
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :composeApp:packageExe :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        with: { name: TsunamiTV-windows, path: composeApp/build/compose/binaries/main/** }
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: TsunamiTV-apk, path: composeApp/build/outputs/apk/debug/*.apk }
